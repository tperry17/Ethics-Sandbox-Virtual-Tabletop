# The checks CLAUDE.md requires before a change is called done, on every
# pull request and on every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Ruff, mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy sandbox tests
      - run: uv run pytest

  browser:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the client, then runs the Chromium tests against a fresh server.
      - run: npm run test:e2e:chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  webkit:
    name: Playwright (WebKit, iPad)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      # Safari's engine, on a laptop and on an iPad in both orientations. A
      # separate job, so that it has its own memory and its own time limit.
      - run: npm run test:e2e:webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-webkit-results
          path: test-results/
          retention-days: 7
