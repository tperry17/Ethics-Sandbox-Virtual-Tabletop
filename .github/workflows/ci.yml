# The checks CLAUDE.md requires before a change is called done, on every
# pull request and on every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Ruff, mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy sandbox tests
      - run: uv run pytest

  load:
    name: Load check (ten minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      # Eight people, 300 pieces, ten minutes of continuous activity: memory
      # flat and no outbound queue backing up. The same test runs for eight
      # seconds in the pytest job above.
      - run: uv run pytest tests/test_load.py
        env:
          SANDBOX_LOAD_SECONDS: "600"

  browser:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the client, then runs the Chromium tests against a fresh server.
      - run: npm run test:e2e:chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  webkit:
    name: Playwright (WebKit, iPad) ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Three short runs rather than one long one: a single WebKit run of the
      # whole set was shut down by the runner about four minutes in, every time.
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      # Safari's engine, on a laptop and on an iPad in both orientations. A
      # separate job, so that it has its own memory and its own time limit.
      - run: npm run test:e2e:webkit -- --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-webkit-results-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  windows:
    name: Windows (serve-tunnel.cmd)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # As docs/FACILITATING-ON-WINDOWS.md clones: line endings as committed.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install cloudflared
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cloudflared'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile (Join-Path $dir 'cloudflared.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: The script parses in Windows PowerShell
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\serve-tunnel.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
      # The whole script as a facilitator runs it, checks included, in the
      # background; then the server must answer and name the tunnel's
      # address. Reaching it through Cloudflare is tried but not required,
      # since a new quick-tunnel address can take a while to resolve.
      - name: Serve through a quick tunnel
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'serve'
          $server = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'scripts\serve-tunnel.cmd', '-NoPull' -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err" -PassThru
          $page = $null
          $deadline = (Get-Date).AddMinutes(20)
          while (-not $page -and (Get-Date) -lt $deadline -and -not $server.HasExited) {
            Start-Sleep -Seconds 5
            try { $page = (Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 5).Content } catch { }
          }
          Get-Content "$log.out", "$log.err" -ErrorAction SilentlyContinue
          $address = [regex]::Match([string]$page, 'https://[a-z0-9-]+\.trycloudflare\.com').Value
          $reached = $false
          if ($address) {
            foreach ($try in 1..12) {
              try { Invoke-WebRequest -UseBasicParsing -Uri "$address/health" -TimeoutSec 10 | Out-Null; $reached = $true; break } catch { Start-Sleep -Seconds 5 }
            }
          }
          taskkill /T /F /PID $server.Id | Out-Null
          if (-not $page) { Write-Error 'The server never answered /health.'; exit 1 }
          if (-not $address) { Write-Error '/health does not name a trycloudflare.com address.'; exit 1 }
          if ($reached) { "Reached $address/health through Cloudflare." } else { Write-Warning "Could not reach $address/health through Cloudflare within a minute." }
