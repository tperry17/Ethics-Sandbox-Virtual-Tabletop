# The Windows route (scripts\serve-tunnel.cmd), run on Windows as a
# facilitator runs it, checks included. Windows minutes count double against
# a private repository's allowance, so it runs only when what it exercises
# changes: the serve scripts, the development helper, the dependency lists,
# or this file. It can also be run by hand from the Actions tab.
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "sandbox/dev.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - ".gitattributes"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "sandbox/dev.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - ".gitattributes"
      - ".github/workflows/windows.yml"

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows (serve-tunnel.cmd)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Git for Windows' default, as a facilitator's clone has it:
      # .gitattributes must keep the checkout's line endings as committed.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install cloudflared
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cloudflared'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile (Join-Path $dir 'cloudflared.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: The script parses in Windows PowerShell
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\serve-tunnel.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }
      # The whole script as a facilitator runs it, checks included, in the
      # background; then the server must answer and name the tunnel's
      # address. Reaching it through Cloudflare is tried but not required,
      # since a new quick-tunnel address can take a while to resolve.
      # A .venv built in another folder and moved here, as when a
      # facilitator moves the project: the script must rebuild it.
      - name: Put a moved .venv in place
        shell: powershell
        run: |
          $elsewhere = Join-Path $env:RUNNER_TEMP 'elsewhere'
          Copy-Item -Recurse -Path . -Destination $elsewhere
          Push-Location $elsewhere
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          Move-Item (Join-Path $elsewhere '.venv') '.venv'
          Remove-Item -Recurse -Force $elsewhere
          & .venv\Scripts\pytest.exe --version
          if ($LASTEXITCODE -eq 0) { Write-Error 'The moved .venv still works, so this step tests nothing.'; exit 1 }
          exit 0
      # An earlier run's server and quick tunnel still running, as when a
      # facilitator closes the window: the script must stop them and go on.
      # The stand-in server listens on port 8000 under the command line the
      # real one has; the tunnel is a real leftover quick tunnel.
      - name: Leave an earlier run behind
        shell: powershell
        run: |
          $server = Start-Process -FilePath python -ArgumentList '-c', '"import http.server as h; h.HTTPServer((''127.0.0.1'', 8000), h.SimpleHTTPRequestHandler).serve_forever()"', 'sandbox.web.app:app', '--host', '127.0.0.1', '--port', '8000' -PassThru
          $tunnel = Start-Process -FilePath cloudflared -ArgumentList 'tunnel', '--no-autoupdate', '--url', 'http://localhost:8000' -PassThru
          Start-Sleep -Seconds 5
          if ($server.HasExited) { Write-Error 'The stand-in server did not start.'; exit 1 }
          if (-not (Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue)) { Write-Error 'Nothing is listening on port 8000.'; exit 1 }
          # Each process's id and start time: Windows reuses ids quickly, and
          # the script starts many processes before the check below.
          "$($server.Id):$($server.StartTime.Ticks) $($tunnel.Id):$($tunnel.StartTime.Ticks)" | Set-Content (Join-Path $env:RUNNER_TEMP 'leftovers')
      - name: Serve through a quick tunnel
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'serve'
          $server = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'scripts\serve-tunnel.cmd', '-NoPull' -RedirectStandardOutput "$log.out" -RedirectStandardError "$log.err" -PassThru
          $page = $null
          $deadline = (Get-Date).AddMinutes(20)
          while (-not $page -and (Get-Date) -lt $deadline -and -not $server.HasExited) {
            Start-Sleep -Seconds 5
            try { $page = (Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8000/health' -TimeoutSec 5).Content } catch { }
          }
          Get-Content "$log.out", "$log.err" -ErrorAction SilentlyContinue
          $address = [regex]::Match([string]$page, 'https://[a-z0-9-]+\.trycloudflare\.com').Value
          $reached = $false
          if ($address) {
            foreach ($try in 1..12) {
              try { Invoke-WebRequest -UseBasicParsing -Uri "$address/health" -TimeoutSec 10 | Out-Null; $reached = $true; break } catch { Start-Sleep -Seconds 5 }
            }
          }
          taskkill /T /F /PID $server.Id | Out-Null
          if (-not $page) { Write-Error 'The server never answered /health.'; exit 1 }
          if (-not (Select-String -Path "$log.out" -SimpleMatch 'built for another folder; rebuilding it' -Quiet)) { Write-Error 'The script did not rebuild the moved .venv.'; exit 1 }
          foreach ($entry in (Get-Content (Join-Path $env:RUNNER_TEMP 'leftovers')).Split(' ')) {
            $id, $ticks = $entry.Split(':')
            $process = Get-Process -Id $id -ErrorAction SilentlyContinue
            if ($process -and [string]$process.StartTime.Ticks -eq $ticks) { Write-Error "The earlier run's process $id is still running."; exit 1 }
          }
          if (-not (Select-String -Path "$log.out" -SimpleMatch "Stopping an earlier run's" -Quiet)) { Write-Error 'The script did not report stopping the earlier run.'; exit 1 }
          if (-not $address) { Write-Error '/health does not name a trycloudflare.com address.'; exit 1 }
          if ($reached) { "Reached $address/health through Cloudflare." } else { Write-Warning "Could not reach $address/health through Cloudflare within a minute." }
