# Pairs - the worked example of a game definition, kept with the tests.
# CLAUDE.md, "Game definitions", explains every section of this file.

meta:
  slug: pairs
  title: Pairs
  players: {min: 2, max: 2}
  duration_minutes: 10
  facilitator: optional
  listed: false            # a test fixture, never on the public site

components:
  decks:
    - id: cards
      source: exercises/pairs/cards.csv
      key: name            # unique per card; part of its component id
      title: name
      body: text

seats:
  labels: [First seat, Second seat]

zones:
  - id: table
    kind: table
    label: The table
    rect: [0, 0, 1400, 1000]
    visibility: public
    layout: free
  - id: deck
    kind: deck
    label: Deck
    rect: [40, 340, 240, 320]
    visibility: hidden
    layout: stack
  - id: caught
    kind: slot
    label: Pairs caught
    rect: [420, 340, 560, 320]
    visibility: public
    layout: spread
    capacity: 8
  - id: hand
    kind: hand
    label: Hand
    rect: [420, 700, 560, 280]
    visibility: private_to_owner
    layout: fan
    per_seat: true
    step: [0, -680]        # the second seat's hand sits across the table

setup:
  - {op: spawn_deck, deck: cards, zone: deck}   # a hidden deck is shuffled as it is made

macros:                    # what each button says: content/.../buttons.csv
  - id: deal
    steps:
      - {op: deal, from: deck, to: hand, count: 3}   # into a private hand, so face up
  - id: call_pairs
    who: anyone
    python: call_pairs
  # Back to how the table was when it began. The facilitator's, or, with
  # nobody facilitating, its players'.
  - id: reset
    steps:
      - {op: reset_table}
      - {op: setup}
  - id: shuffle
    steps:
      - {op: shuffle, zone: deck}
  - id: collect
    steps:
      - {op: collect, to: deck, kinds: [card], face_up: false}
      - {op: shuffle, zone: deck}
  - id: clear_ink
    steps:
      - {op: clear_ink}

buttons:
  source: exercises/pairs/buttons.csv

prompts:
  source: exercises/pairs/prompts.csv
