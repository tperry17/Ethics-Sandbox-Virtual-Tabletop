# The open room. Nothing in it is an exercise: a free table, a deck of the
# value cards, a tray of dice and markers, and a private hand for each seat.
# An activity is a separate game definition started inside a room.
meta:
  slug: sandbox
  title: Open table
  players: {min: 1, max: 20}     # the room's capacity
  duration_minutes: 60
  facilitator: optional
  listed: false

components:
  decks:
    - id: values
      source: decks/value-cards/cards.csv
      key: key
      title: name
      body: definition
      folio: number
      image: art
  pieces:
    - {id: d6, kind: die, title: Die, faces: ["1", "2", "3", "4", "5", "6"]}
    - {id: cube, kind: cube, title: Cube}
    - {id: meeple, kind: meeple, title: Meeple}
    - {id: token, kind: token, title: Token}

zones:
  - id: table
    kind: table
    label: The table
    rect: [0, 0, 1700, 900]
    visibility: public
    layout: free
  - id: deck
    kind: deck
    label: Value cards
    rect: [40, 40, 240, 320]
    visibility: hidden
    layout: stack
  - id: kit
    kind: tray
    label: Dice and markers
    rect: [320, 40, 1340, 320]
    visibility: public
    layout: grid
  - id: hand
    kind: hand
    label: Hand
    rect: [40, 940, 1200, 220]
    visibility: private_to_owner
    layout: fan
    per_seat: true
    step: [0, 240]

setup:
  - {op: spawn_deck, deck: values, zone: deck}
  - {op: spawn, component: d6, zone: kit, count: 2}
  - {op: spawn, component: cube, zone: kit, count: 6}
  - {op: spawn, component: meeple, zone: kit, count: 6}
  - {op: spawn, component: token, zone: kit, count: 6}

macros:
  - id: setup
    steps:
      - {op: reset_table}
      - {op: setup}
  - id: deal
    who: anyone
    steps:
      - {op: deal, from: deck, to: hand, count: 3}
  - id: reset
    steps:
      - {op: reset_table}
  - id: shuffle
    who: anyone
    steps:
      - {op: shuffle, zone: deck}
  - id: collect
    who: anyone
    steps:
      - {op: collect, to: deck, kinds: [card], face_up: false}
      - {op: shuffle, zone: deck}
  - id: clear_ink
    who: anyone
    steps:
      - {op: clear_ink}

buttons:
  source: exercises/sandbox/buttons.csv

prompts:
  source: exercises/sandbox/prompts.csv
