# The Leadership and Knowledge in Popular Rule room: the exercise's sandbox.
# Its table holds the two cities' seals and a general account of each, with
# nothing about either scenario. Its activities are its own: Scenario 1, and
# Scenario 2 (always a class, one table per city), and its debrief.
meta:
  slug: democracy-room
  title: Leadership and Knowledge in Popular Rule
  players: {min: 1, max: 30}     # the room's capacity
  duration_minutes: 60
  facilitator: optional
  listed: false

room:
  exercise: democracy-simulation
  label: Leadership and Knowledge in Popular Rule
  activities:
    - {id: scenario-1, game: democracy-simulation, title: "Scenario 1: Construction project", options: {phase: "1"}}
    - {id: scenario-2, game: democracy-simulation, title: "Scenario 2: Going to war?", options: {phase: "2"}, class_only: true}
    - {id: democracy-debrief, game: democracy-debrief}
  pieces: [d6, cube-1, cube-2, cube-3, cube-4, cube-5, cube-6, meeple-1, meeple-2, meeple-3, meeple-4, meeple-5, meeple-6, token-1, token-2, token-3, token-4, token-5, token-6]

components:
  decks:
    - id: cities
      source: exercises/democracy-simulation/cities.csv
      key: key
      title: name
      body: account
      image: image
      width: 300
      height: 480
  pieces:
    - {id: d6, kind: die, title: Die, faces: ["1", "2", "3", "4", "5", "6"]}
    - {id: cube-1, kind: cube, title: Cube, tint_index: 0}
    - {id: cube-2, kind: cube, title: Cube, tint_index: 1}
    - {id: cube-3, kind: cube, title: Cube, tint_index: 2}
    - {id: cube-4, kind: cube, title: Cube, tint_index: 3}
    - {id: cube-5, kind: cube, title: Cube, tint_index: 4}
    - {id: cube-6, kind: cube, title: Cube, tint_index: 5}
    - {id: meeple-1, kind: meeple, title: Meeple, tint_index: 0}
    - {id: meeple-2, kind: meeple, title: Meeple, tint_index: 1}
    - {id: meeple-3, kind: meeple, title: Meeple, tint_index: 2}
    - {id: meeple-4, kind: meeple, title: Meeple, tint_index: 3}
    - {id: meeple-5, kind: meeple, title: Meeple, tint_index: 4}
    - {id: meeple-6, kind: meeple, title: Meeple, tint_index: 5}
    - {id: token-1, kind: token, title: Token, tint_index: 0}
    - {id: token-2, kind: token, title: Token, tint_index: 1}
    - {id: token-3, kind: token, title: Token, tint_index: 2}
    - {id: token-4, kind: token, title: Token, tint_index: 3}
    - {id: token-5, kind: token, title: Token, tint_index: 4}
    - {id: token-6, kind: token, title: Token, tint_index: 5}

zones:
  - id: table
    kind: table
    label: The table
    rect: [0, 0, 1700, 900]
    visibility: public
    layout: free
  - id: potamosia
    kind: tray
    label: Potamosia
    rect: [40, 40, 360, 540]
    visibility: public
    layout: stack
  - id: hudrosia
    kind: tray
    label: Hudrosia
    rect: [440, 40, 360, 540]
    visibility: public
    layout: stack

setup:
  - {op: spawn_deck, deck: cities, zone: potamosia, where: {key: potamosia}}
  - {op: spawn_deck, deck: cities, zone: hudrosia, where: {key: hudrosia}}

macros:
  - id: setup
    steps:
      - {op: reset_table}
      - {op: setup}
  - id: reset
    steps:
      - {op: reset_table}
  - id: clear_ink
    who: anyone
    steps:
      - {op: clear_ink}

buttons:
  source: exercises/democracy-room/buttons.csv
