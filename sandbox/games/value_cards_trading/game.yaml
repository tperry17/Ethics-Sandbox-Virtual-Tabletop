# Value Cards Trading. The rules are in docs/BUILD-PLAN.md, Prompt 10.
meta:
  slug: value-cards-trading
  title: Value Cards Trading
  players: {min: 3, max: 6}
  duration_minutes: 30
  facilitator: optional
  listed: true

components:
  decks:
    - id: values
      source: decks/value-cards/cards.csv
      key: key
      title: name
      body: definition
      folio: number
      image: art
      face_image: face          # the printed card, frame and all
      group: group
      badge: schwartz
      width: 150
      height: 210

seats:
  labels: [First player, Second player, Third player, Fourth player, Fifth player, Sixth player]

zones:
  - id: table
    kind: table
    label: The table
    rect: [0, 0, 2200, 1960]      # room for six seats' rows
    visibility: public
    layout: free
  - id: deck
    kind: deck
    label: Deck
    rect: [40, 40, 240, 320]
    visibility: hidden
    layout: stack
  - id: sidebar                   # the other 18, dealt too with four or more players
    kind: deck
    label: Sidebar
    rect: [320, 40, 240, 320]
    visibility: hidden
    layout: stack
  - id: hand
    kind: seat_area               # each player's cards lie open on the board, not in a hand
    label: Cards on the table
    rect: [40, 400, 1600, 230]
    visibility: public            # open within the trio
    owner_moves_only: true        # but only the owner arranges them
    layout: spread
    per_seat: true
    step: [0, 260]
  - id: top-three
    kind: slot
    label: Top three
    rect: [1680, 400, 480, 230]
    visibility: private_to_owner  # shared only by the owner's choice, with Show
    layout: spread
    capacity: 3
    per_seat: true
    step: [0, 260]

setup:
  # Three play with the 18 cards of the base deck (group "Deck"); four to
  # six play with all 36, the sidebar's 18 joining the deck when dealt.
  - {op: spawn_deck, deck: values, zone: deck, where: {group: Deck}}
  - {op: spawn_deck, deck: values, zone: sidebar, where: {group: Sidebar}}

macros:
  - id: setup
    steps:
      - {op: reset_table}
      - {op: setup}
  - id: deal
    python: deal_six_each       # with four or more, the sidebar joins the deck first
  - id: record_hands
    who: anyone
    python: record_hands
  - id: reset
    steps:
      - {op: reset_table}
  - id: shuffle
    steps:
      - {op: shuffle, zone: deck}
  - id: collect
    steps:
      - {op: collect, to: deck, kinds: [card], where: {group: Deck}, face_up: false}
      - {op: collect, to: sidebar, kinds: [card], where: {group: Sidebar}, face_up: false}
      - {op: shuffle, zone: deck}
      - {op: shuffle, zone: sidebar}
  - id: clear_ink
    steps:
      - {op: clear_ink}

buttons:
  source: exercises/value-cards-trading/buttons.csv

prompts:
  source: exercises/value-cards-trading/prompts.csv
