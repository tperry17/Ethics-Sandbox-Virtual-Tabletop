{# A still picture of a table after setup, built by sandbox/web/preview.py
   from the spectator projection. Colours come from the design tokens. #}
{% macro table_preview(preview, caption=none) -%}
<figure class="table-picture">
  <svg class="table-picture__svg" viewBox="{{ preview.view_box }}" role="img"
       aria-labelledby="table-picture-title">
    <title id="table-picture-title">The {{ preview.title }} table</title>
    {% for zone in preview.zones %}
    <g class="table-picture__zone table-picture__zone--{{ zone.visibility }} table-picture__zone--{{ zone.kind }}">
      <rect x="{{ zone.x }}" y="{{ zone.y }}" width="{{ zone.width }}" height="{{ zone.height }}" rx="12"></rect>
      {% if zone.kind != "table" %}
      {# Labels are 36 units, shrunk to fit a narrow zone (about 0.6 em a character). #}
      {% set label_size = [36, (zone.width - 36) / (0.6 * (zone.label | length))] | min %}
      <text x="{{ zone.x + 18 }}" y="{{ zone.y + 10 + label_size }}" font-size="{{ '%.1f' | format(label_size) }}">{{ zone.label }}</text>
      {% endif %}
    </g>
    {% endfor %}
    {% for piece in preview.pieces %}
    <g class="table-picture__piece table-picture__piece--{{ piece.kind }}{% if piece.title is none %} is-back{% endif %}"
       transform="rotate({{ piece.rotation }} {{ piece.x + piece.width / 2 }} {{ piece.y + piece.height / 2 }})">
      <rect x="{{ piece.x }}" y="{{ piece.y }}" width="{{ piece.width }}" height="{{ piece.height }}" rx="10"></rect>
      {% if piece.title is not none %}
      <text x="{{ piece.x + 16 }}" y="{{ piece.y + 48 }}">{{ piece.title }}</text>
      {% endif %}
    </g>
    {% endfor %}
  </svg>
  <figcaption class="table-picture__caption">
    {% if caption %}{{ caption }}{% else %}Set up for {{ preview.seats }} {{ "seat" if preview.seats == 1 else "seats" }}. Faces
    nobody may see yet are drawn as backs.{% endif %}
  </figcaption>
</figure>
{%- endmacro %}
