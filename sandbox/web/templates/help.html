{% import "_ui.html" as ui %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Help · Ethics Sandbox</title>
    <link rel="icon" href="{{ url_for('static', path='/icons/favicon.ico') }}" sizes="48x48">
    <link rel="icon" href="{{ url_for('static', path='/icons/seal-512.png') }}" type="image/png" sizes="512x512">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/site.css') }}">
  </head>
  <body>
    <main class="site">
      <p class="site__back"><a href="/">← Ethics Sandbox</a></p>

      <header class="site__header">
        <p class="eyebrow">Help</p>
        <h1>Records, export and deletion</h1>
        <div class="prose site__lede">
          <p>What a room remembers, who can see it, and how it goes away.</p>
        </div>
      </header>

      {% for item in records %}
      <section class="site__section">
        {{ ui.section_rule(item.heading) }}
        <div class="prose"><p>{{ item.text }}</p></div>
      </section>
      {% endfor %}
    </main>
  </body>
</html>
