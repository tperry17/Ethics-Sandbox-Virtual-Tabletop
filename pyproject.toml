[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ethics-sandbox"
version = "0.1.0"
description = "A virtual tabletop for structured ethics and democracy exercises."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
dev = "sandbox.dev:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "hypothesis>=6.130,<7",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["sandbox"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sandbox", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Form()/Query() defaults are a documented idiom, not the
# mutable-default-argument bug B008 is meant to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]

